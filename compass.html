<title>EE Compass</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--tx:#1d2330;--mut:#667085;--line:#e3e5ea;--ac:#2563eb;--crit:#dc2626;--ok:#16a34a;--c1:#2563eb;--c2:#0d9488;--c3:#d97706;--c4:#7c3aed;color-scheme:light}

:root[data-theme="dark"]{--bg:#10141c;--card:#181e2a;--tx:#e8ebf2;--mut:#9aa3b5;--line:#2a3243;--ac:#6b9bff;--crit:#f87171;--ok:#4ade80;--c1:#6b9bff;--c2:#2dd4bf;--c3:#fbbf24;--c4:#a78bfa;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:4px 0}h2{font-size:19px;margin:0 0 4px}h3{font-size:15px;margin:16px 0 8px}
.sub,.hint{color:var(--mut)}.hint{font-size:12px}a{color:var(--ac)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;scroll-margin-top:110px}
.ctl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:12px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{font:inherit;font-size:13px;border:0;background:none;color:var(--tx);padding:6px 12px;cursor:pointer}
.seg button.on{background:var(--ac);color:#fff}
.ctl label{font-size:13px;color:var(--mut);display:flex;gap:6px;align-items:center}
.ctl select{max-width:100%;min-width:0}.ctl label{max-width:100%}
.pbtn,.ctl select{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--tx);padding:6px 12px;cursor:pointer}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}.toc a{font-size:13px;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--tx);background:var(--card)}.toc a:hover{border-color:var(--ac);color:var(--ac)}
/* chain of ideas */
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0 14px}
.chain span{font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px;color:var(--k);background:color-mix(in srgb,var(--k) 13%,transparent);border:1px solid color-mix(in srgb,var(--k) 35%,transparent)}
.chain i{font-style:normal;color:var(--mut)}
.k1{--k:var(--c1)}.k2{--k:var(--c2)}.k3{--k:var(--c3)}.k4{--k:var(--c4)}
/* numbered steps */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;counter-reset:s}
.step{background:var(--bg);border-radius:12px;padding:12px 12px 12px 50px;position:relative;font-size:14px}
.step::before{counter-increment:s;content:counter(s);position:absolute;left:12px;top:12px;width:28px;height:28px;border-radius:50%;background:var(--k,var(--ac));color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.step b{display:block;margin-bottom:2px}
/* boxes */
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:10px 0}
.box{border:1px solid var(--line);border-left:5px solid var(--k);border-radius:10px;padding:10px 12px;background:var(--card);font-size:14px}
.box .lb{display:block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--k);margin-bottom:4px}
.box.sup{background:color-mix(in srgb,var(--c4) 7%,var(--card))}
.box.rq p{font-weight:600;margin:0}.box p{margin:0}
.meet{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
@media (max-width:600px){.meet{grid-template-columns:1fr}}
/* route stepper */
.route{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 8px;position:relative}
.route button{font:inherit;text-align:left;background:var(--bg);border:2px solid transparent;border-radius:12px;padding:10px;cursor:pointer;color:var(--tx);font-size:13px;font-weight:600;position:relative}
.route button .n{display:flex;width:26px;height:26px;border-radius:50%;background:var(--k);color:#fff;align-items:center;justify-content:center;margin-bottom:6px;font-size:13px}
.route button.on{border-color:var(--k);background:color-mix(in srgb,var(--k) 9%,var(--card))}
.route button:not(:last-child)::after{content:"→";position:absolute;right:-9px;top:14px;color:var(--mut);font-weight:400}
@media (max-width:640px){.route{grid-template-columns:1fr 1fr}.route button::after{display:none}}
.rdet{background:color-mix(in srgb,var(--k) 7%,var(--card));border:1px solid color-mix(in srgb,var(--k) 30%,transparent);border-radius:12px;padding:12px 14px;font-size:14px}
.rdet ul{margin:6px 0 0;padding-left:20px}
.src{font-size:11px;color:var(--mut);margin-top:6px}

.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}

.cmp div{border-radius:10px;padding:10px 12px;font-size:14px}
.cmp .no{background:color-mix(in srgb,var(--crit) 9%,var(--card));border:1px solid color-mix(in srgb,var(--crit) 35%,transparent)}
.cmp .yes{background:color-mix(in srgb,var(--ok) 9%,var(--card));border:1px solid color-mix(in srgb,var(--ok) 35%,transparent)}
.cmp b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em}.cmp .no b{color:var(--crit)}.cmp .yes b{color:var(--ok)}
/* evidence table as cards */
.ev{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.ev div{background:var(--bg);border-radius:10px;padding:9px 11px;font-size:13px}.ev b{display:block;font-size:14px;color:var(--c2)}
.warnl{list-style:none;padding:0;margin:8px 0}.warnl li{font-size:14px;padding:4px 0 4px 26px;position:relative}.warnl li::before{content:"⚠️";position:absolute;left:0}
/* timeline */
.tl{border-left:3px solid var(--line);margin:8px 0 0 10px;padding-left:18px}
.tl div{position:relative;margin-bottom:12px;font-size:14px}.tl div::before{content:"";position:absolute;left:-26px;top:5px;width:13px;height:13px;border-radius:50%;background:var(--k,var(--ac));border:2px solid var(--card)}
.tl b{display:block}
/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tabs button{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:10px;padding:7px 14px;cursor:pointer}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
/* highlighted example */
.exm{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.7}
.hl{border-radius:4px;padding:1px 2px;background:color-mix(in srgb,var(--k) 16%,transparent);box-shadow:inset 0 -2px 0 var(--k);transition:opacity .2s}
.exm.f .hl:not(.sel){opacity:.3}
.leg{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.leg button{font:inherit;font-size:12px;font-weight:600;border:1px solid color-mix(in srgb,var(--k) 40%,transparent);color:var(--k);background:color-mix(in srgb,var(--k) 10%,var(--card));border-radius:999px;padding:3px 10px;cursor:pointer}.leg button.on{background:var(--k);color:#fff}
/* alignment */
.align{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px;margin:10px 0}.align div{flex:1 1 150px;background:var(--bg);border-radius:10px;padding:10px;text-align:center;font-weight:600;font-size:14px}.align i{font-style:normal;align-self:center;font-size:22px;color:var(--ok)}
table.sv{width:100%;border-collapse:collapse;font-size:14px}table.sv th,table.sv td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}table.sv th{color:var(--mut);font-size:12px}
@media (max-width:600px){table.sv thead{display:none}table.sv tr{display:block;border-bottom:1px solid var(--line);padding:6px 0}table.sv td{display:block;border:0;padding:3px 0}table.sv td::before{content:attr(data-l);display:block;font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase}}
/* role panels */
.todo{list-style:none;padding:0;margin:8px 0}.todo li{margin:6px 0}.todo label{display:flex;gap:8px;font-size:14px;align-items:flex-start;cursor:pointer}.todo input{margin-top:4px}
.todo .g{font-size:12px;color:var(--mut);font-weight:700;text-transform:uppercase;margin-top:12px}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0}.prog div{height:100%;background:var(--ok)}
.cta{display:inline-block;margin-top:10px;font-size:14px;font-weight:600;text-decoration:none;border:1px solid var(--ac);border-radius:10px;padding:7px 12px}
.note{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--mut)}
@media print{.ee-top,.site-foot,.ctl,.toc,.ee-up,.tabs,.leg,.cta{display:none!important}body{background:#fff}.card{break-inside:avoid;border-color:#bbb}main{max-width:none}}

 bound:A("Do not estimate demand elasticity from price and quantity changes without considering supply shifts and other influences. An honestly bounded answer is better than an unsupported causal claim.","Не оценивайте эластичность спроса по изменениям цены и количества, не учитывая сдвиги предложения и другие факторы. Честно ограниченный ответ лучше необоснованного вывода о причине.","Ұсыныстың ығысуын және басқа факторларды ескермей, баға мен көлем өзгерісінен сұраныс икемділігін бағаламаңыз. Негізсіз себептік тұжырымнан гөрі шегі адал көрсетілген жауап жақсы."),
 str:[[A("Introduction","Введение","Кіріспе"),A("Define the market, product, place, dates and RQ. Explain the economic significance and why the available evidence can address the question.","Определите рынок, товар, место, даты и вопрос. Объясните экономическую значимость и почему доступные данные позволяют ответить на вопрос.","Нарықты, тауарды, орынды, мерзімді және сұрақты анықтаңыз. Экономикалық маңызын және қолдағы деректер сұраққа неге жауап бере алатынын түсіндіріңіз.")],
      [A("Approach and evidence","Подход и данные","Тәсіл және деректер"),A("Explain the datasets, comparability decisions, selected period and method. Identify missing variables and limits on causal inference.","Опишите наборы данных, решения о сопоставимости, выбранный период и метод. Назовите недостающие переменные и пределы выводов о причинах.","Деректер жиынтығын, салыстыру бойынша шешімдерді, таңдалған кезеңді және әдісті түсіндіріңіз. Жетіспейтін айнымалылар мен себептік қорытындының шегін атаңыз.")],
      [A("Theory in use","Теория в работе","Теорияны қолдану"),A("Apply relevant theory at the point of analysis. Use labelled diagrams tied to the actual market, not a separate textbook theory chapter.","Применяйте теорию там, где идёт анализ. Используйте подписанные диаграммы, привязанные к реальному рынку, а не отдельную главу пересказа учебника.","Теорияны талдау жүріп жатқан жерде қолданыңыз. Оқулықтан бөлек тарау емес, нақты нарыққа байланысты белгіленген диаграммаларды пайдаланыңыз.")],
      [A("Analysis","Анализ","Талдау"),A("Present trends, calculations and relationships, then explain them economically. Organise around mechanisms or sub-claims, not one section per source.","Покажите тренды, расчёты и связи, затем объясните их экономически. Стройте разделы вокруг механизмов или частных тезисов, а не по одному разделу на источник.","Трендтерді, есептеулер мен байланыстарды көрсетіп, оларды экономикалық тұрғыдан түсіндіріңіз. Бөлімдерді дереккөздер бойынша емес, механизмдер немесе жеке тезистер бойынша құрыңыз.")],
      [A("Evaluation","Оценка","Бағалау"),A("Weigh rival factors, short-run versus long-run effects and stakeholders. Evaluate the fit of the model and the strength of the evidence.","Взвесьте конкурирующие факторы, краткосрочные и долгосрочные эффекты и интересы сторон. Оцените, насколько подходит модель и насколько сильны данные.","Бәсекелес факторларды, қысқа және ұзақ мерзімді әсерлерді және мүдделі тараптарды салмақтаңыз. Модельдің сәйкестігін және деректердің күшін бағалаңыз.")],
      [A("Conclusion","Заключение","Қорытынды"),A("Give a qualified answer for the defined market and period. Explain what can and cannot be inferred about the mechanism; add no new data.","Дайте взвешенный ответ для выбранного рынка и периода. Объясните, что можно и чего нельзя заключить о механизме; новых данных не добавляйте.","Таңдалған нарық пен кезең үшін салмақты жауап беріңіз. Механизм туралы не айтуға болатынын және болмайтынын түсіндіріңіз; жаңа дерек қоспаңыз.")]],

  lead:A("Help the reader understand the problem, why it matters and how you will investigate it.","Читателю должно быть понятно, какую проблему ты исследуешь, почему она заслуживает внимания и как ты получишь ответ.","Оқырман қандай мәселені, неліктен және қалай зерттейтініңді түсінуі керек."),
  s:[A("Establish the problem. Identify a tension or uncertainty that gives rise to the question. Cite the scholarship that supports your account of the problem.","Поставь проблему. Покажи конкретное противоречие или неопределённость, из которых возникает вопрос. Если ссылаешься на научную или критическую позицию, укажи источник.","Мәселені нақтыла. Зерттеу сұрағына алып келетін қайшылықты немесе білімдегі белгісіздікті көрсет. Ғылыми не сыни пікірге сүйенсең, дереккөзге сілтеме жаса."),
     A("State the RQ in the wording used on the title page. Identify the object, period, corpus or conditions and justify the boundaries.","Сформулируй вопрос и очерти границы. Приведи вопрос в формулировке с титульной страницы. Обоснуй выбор объекта, периода, корпуса или условий.","Сұрақ пен ауқымды белгіле. Сұрақты титул бетіндегі тұжырыммен бер. Нысанды, кезеңді, корпусты немесе жағдайды таңдауыңды негізде."),
     A("Explain the approach and line of argument. Identify the main evidence and how you will analyse it. Show how the stages connect. Revisit the introduction after writing the body.","Объясни подход и ход аргументации. Назови ключевой материал и способ его анализа. Покажи, как этапы исследования связаны между собой. Вернись к введению после написания основной части.","Тәсіл мен дәлелдеу бағытын түсіндір. Негізгі деректі және оны қалай талдайтыныңды ата. Талдау кезеңдері қалай байланысатынын көрсет. Негізгі бөлімді жазған соң кіріспені қайта тексер.")],

  ex:{en:[["","In "],["k1","Frankenstein, readers encounter one conflict through several narrators. Judgements of blame may therefore depend on who tells the story."],[""," "],["k2","How does the novel’s narrative framing complicate the attribution of responsibility?"],[""," "],["k3","I compare the ways Victor and the Creature justify their choices, then examine how Walton’s letters frame both accounts."]],
      ru:[["k1","В «Франкенштейне» один конфликт доходит до читателя через нескольких рассказчиков. Поэтому суждение о вине может зависеть от того, кому принадлежит рассказ."],[""," "],["k2","Как рамочная композиция романа усложняет вопрос об ответственности?"],[""," "],["k3","В эссе я сопоставлю способы самооправдания Виктора и Создания, а затем рассмотрю, как письма Уолтона обрамляют оба свидетельства."]],
      kz:[["k1","«Франкенштейндегі» бір дау оқырманға бірнеше баяндаушы арқылы жетеді. Кінәні кімге жүктейтініміз оқиғаны кімнің айтуына байланысты болуы мүмкін."],[""," "],["k2","Романдағы баяндау құрылымы жауапкершілікті анықтауды қалай күрделендіреді?"],[""," "],["k3","Бұл эссе Виктор мен Жаратылыстың әңгімелеріндегі өзін ақтау тәсілдерін салыстырып, Уолтонның хаттары олардың куәліктерін қалай жеткізетінін талдайды."]]},
  rd:A("The model establishes a problem, a question and an approach. In a full introduction, identify the edition and justify the selection of episodes.","В примере есть проблема, вопрос и подход. В полном введении укажи издание и объясни выбор ключевых эпизодов.","Мысалда мәселе, сұрақ және тәсіл бар. Толық нұсқада басылымды көрсетіп, үзінділерді неге таңдағаныңды негізде."),

  s:[A("Open the section with a claim. State what you intend to establish and introduce the concept or theory needed to understand it.","Начни раздел с тезиса. Укажи, какую мысль о предмете исследования ты обоснуешь. Введи понятие или теорию там, где они помогают понять этот тезис.","Бөлімді тезистен баста. Зерттеу сұрағына қатысты қандай ойды негіздейтініңді айт. Осы ойға қажетті ұғымды немесе теорияны түсіндір."),
     A("Present and analyse evidence. Select a passage, document, map, measurement or calculation. Identify its source. Isolate the relevant detail and explain the reasoning from detail to claim.","Приведи и разбери свидетельство. Это может быть отрывок, документ, карта, измерение или расчёт. Укажи источник. Выдели конкретную особенность материала и объясни, почему она поддерживает тезис.","Дәлелді ұсын және талда. Үзінді, құжат, карта, өлшеу немесе есеп таңда. Дереккөзді көрсет. Дәлелдің нақты ерекшелігін атап, одан тезиске қалай келгеніңді түсіндір."),

      ru:[["k1","Письма Уолтона заставляют обратить внимание на то, кто передаёт рассказ Виктора и кому он адресован."],[""," "],["k2","Уолтон пишет сестре о своей экспедиции и включает в письма встречу с Виктором. Значит, читатель знакомится с версией Виктора через посредника."],[""," "],["k3","Само посредничество ещё не доказывает, что рассказ ложен."],[""," "],["k4","Теперь можно сопоставить, как Уолтон характеризует Виктора и как передаёт встречу с Созданием."]],

  rd:A("This models the reasoning. In the essay, add an exact quotation, its page in your edition and analysis of the wording. In an experimental essay, use measurements, calculations and uncertainty to support the inference.","Это модель рассуждения. В реальном эссе добавь точную цитату, страницу выбранного издания и разбор слов. В экспериментальной работе ту же функцию выполняют измерение, расчёт и анализ неопределённости.","Бұл ойлау үлгісі. Нақты эсседе таңдалған басылымнан дәйексөз бен бет нөмірін қосып, сөз қолданысын талда. Эксперименттік жұмыста осы қызметті өлшеу, есеп және белгісіздікті талдау атқарады."),

 addSheet(g3,d.sv);addSheet(g3,d.psup);d.svl.forEach(function(x){addSheet(g3,x)});
 WR.forEach(function(w,i){addTodo(g4,"w"+i,A(w.t.en+": "+w.stu.en,w.t.ru+": "+w.stu.ru,w.t.kz+": "+w.stu.kz));addSheet(g4,A(w.t.en+": "+w.sup.en,w.t.ru+": "+w.sup.ru,w.t.kz+": "+w.sup.kz))});
 CARDS.meet.s.forEach(function(x,i){addTodo(g5,"m"+i,x)});addTodo(g5,"al",SVL.al);

function panel(){if(ROLE=="all")return"";collect();
 if(ROLE=="stu"){var n=TODO.filter(function(t){return DONE[t[1]]}).length,g="";
  var h='<section class="card" id="c0" style="border-color:var(--ok)"><h2>✅ '+esc(T(U.todoT))+'</h2><p class="hint">'+esc(T(U.todoS))+'</p><div class="prog"><div style="width:'+Math.round(100*n/TODO.length)+'%"></div></div><p class="hint" style="margin:0">'+n+" / "+TODO.length+" "+esc(T(U.done))+'</p><ul class="todo">';
  TODO.forEach(function(t){var gg=T(t[0]);if(gg!=g){g=gg;h+='<li class="g">'+esc(gg)+"</li>"}h+='<li><label><input type="checkbox" data-td="'+esc(t[1])+'"'+(DONE[t[1]]?" checked":"")+"> <span>"+esc(T(t[2]))+"</span></label></li>"});
  return h+"</ul></section>"}
 var g="",h='<section class="card" id="c0" style="border-color:var(--c4)"><h2>👩‍🏫 '+esc(T(U.sheetT))+'</h2><p class="hint">'+esc(T(U.sheetS))+'</p><ul class="todo">';
 SHEET.forEach(function(t){var gg=T(t[0]);if(gg!=g){g=gg;h+='<li class="g">'+esc(gg)+"</li>"}h+="<li>❓ "+esc(T(t[1]))+"</li>"});
 return h+"</ul></section>"}

function render(){document.documentElement.lang=LG=="kz"?"kk":LG;
 document.getElementById("lead").textContent=T(U.lead);document.getElementById("roleL").textContent=T(U.role);document.getElementById("subjL").textContent=T(U.subj);document.getElementById("print").textContent=T(U.print);
 document.getElementById("credit").textContent=T(U.credit);
 document.querySelectorAll("#lang button").forEach(function(b){b.classList.toggle("on",b.dataset.v==LG)});
 document.querySelectorAll("#role button").forEach(function(b){b.classList.toggle("on",b.dataset.v==ROLE);b.textContent=T(U[b.dataset.v])});
 document.getElementById("subj").innerHTML=SUBJ.filter(function(s){return SD[s[0]]}).map(function(s){return'<option value="'+s[0]+'"'+(SD[s[0]]?"":" disabled")+(s[0]==SUB?" selected":"")+">"+esc(T(s[1]))+(SD[s[0]]?"":" ("+esc(T(U.soon))+")")+"</option>"}).join("");
 document.getElementById("toc").innerHTML=(ROLE=="all"?"":'<a href="#c0">'+(ROLE=="stu"?"✅ "+esc(T(U.todoT)):"👩‍🏫 "+esc(T(U.sheetT)))+"</a>")+SEC.map(function(s,i){return'<a href="#c'+(i+1)+'">'+(i+1)+". "+esc(T(s))+"</a>"}).join("");
 document.getElementById("app").innerHTML=panel()+sec1()+sec2()+sec3()+sec4()+sec5();
 document.querySelectorAll("[data-rs]").forEach(function(b){b.onclick=function(){RS=+b.dataset.rs;render()}});
 document.querySelectorAll("[data-wt]").forEach(function(b){b.onclick=function(){WT=+b.dataset.wt;render();document.getElementById("c4").scrollIntoView({block:"start"})}});
 document.querySelectorAll("[data-hl]").forEach(function(b){b.onclick=function(){var on=!b.classList.contains("on");document.querySelectorAll("[data-hl]").forEach(function(x){x.classList.remove("on")});var ex=document.getElementById("exm");ex.classList.toggle("f",on);ex.querySelectorAll(".hl").forEach(function(s){s.classList.toggle("sel",on&&s.dataset.r==b.dataset.hl)});if(on)b.classList.add("on")}});
 document.querySelectorAll("[data-td]").forEach(function(b){b.onchange=function(){if(b.checked)DONE[b.dataset.td]=1;else delete DONE[b.dataset.td];save();var y=scrollY;render();scrollTo(0,y)}});
 save()}
document.querySelectorAll("#lang button").forEach(function(b){b.onclick=function(){LG=b.dataset.v;render()}});
document.querySelectorAll("#role button").forEach(function(b){b.onclick=function(){ROLE=b.dataset.v;render()}});

document.getElementById("subj").onchange=function(){SUB=this.value;if(SUBLG[SUB])LG=SUBLG[SUB];try{localStorage.setItem("ee_cmp_subj",SUB)}catch(e){}render()};

render();
if(location.hash){var t=document.getElementById(location.hash.slice(1));if(t)t.scrollIntoView()}
})();
